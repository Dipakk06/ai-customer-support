[project]
name = "ai-customer-support"
version = "0.1.0"
description = "AI customer support agent demo with LangGraph, FastAPI, Streamlit, RAG, and ticketing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.39.0",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "pydantic>=2.8.0",
]
